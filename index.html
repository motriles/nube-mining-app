<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nube Mining</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #87CEEB; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 80%; }
        button { background: #000; color: #fff; border: none; padding: 15px 25px; border-radius: 30px; font-size: 18px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nube Mining ☁️</h1>
        <p id="status">Iniciando conexión...</p>
        <button id="btnVerify" onclick="verificar()" disabled>Cargando World ID...</button>
    </div>

    <script>
        // Forzamos la instalación y activamos el botón solo cuando esté listo
        const btn = document.getElementById('btnVerify');
        const status = document.getElementById('status');

        function inicializar() {
            try {
                window.MiniKit.install();
                btn.disabled = false;
                btn.innerText = "Verificar con World ID";
                status.innerText = "Sistema listo para minar.";
            } catch (e) {
                setTimeout(inicializar, 1000); // Reintenta cada segundo si falla
            }
        }

        async function verificar() {
            try {
                const { finalPayload } = await window.MiniKit.commandsAsync.verify({
                    action: "claim-daily-mining",
                    verification_level: "orb"
                });
                if (finalPayload.status === "success") alert("¡Éxito! Humano verificado.");
            } catch (error) {
                console.error(error);
            }
        }

        window.onload = inicializar;
    </script>
</body>
</html>
