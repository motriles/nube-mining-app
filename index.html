<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nube Mining</title>
    <!-- SDK oficial de MiniKit para Mini Apps -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 85%; max-width: 400px; }
        button { background: #000; color: #fff; border: none; padding: 18px 25px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 20px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nube Mining ☁️</h1>
        <p id="status">Conectando con World ID...</p>
        <button id="btnVerify" onclick="verificar()" disabled>Cargando...</button>
    </div>

    <script>
        const btn = document.getElementById('btnVerify');
        const status = document.getElementById('status');

        // Inicialización obligatoria
        window.onload = () => {
            if (window.MiniKit) {
                window.MiniKit.install();
                btn.disabled = false;
                btn.innerText = "Verificar Humanidad";
                status.innerText = "Listo para reclamar minado.";
            }
        };

        async function verificar() {
            try {
                // Usamos los datos EXACTOS de tu captura
                const { finalPayload } = await window.MiniKit.commandsAsync.verify({
                    app_id: "app_24d21904fe935d93b843588efab756fc", 
                    action: "claim-daily-mining", 
                    verification_level: "orb" 
                });

                if (finalPayload.status === "success") {
                    status.innerText = "✅ ¡Verificación Exitosa!";
                    btn.innerText = "Minado Activo";
                    btn.style.background = "#4CAF50";
                    alert("¡Humano verificado! Has reclamado tu minado diario.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("La verificación falló. Asegúrate de estar dentro de la World App.");
            }
        }
    </script>
</body>
</html>
