<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nube Mining</title>
    <script src="https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@latest/dist/minikit.min.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f9e27d); color: #000; border: none; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }
        #status { font-size: 12px; color: #555; margin-top: 15px; }
        #main-app { display: none; }
    </style>
</head>
<body>

    <div id="verify-screen">
        <div style="font-size: 50px;">☁️</div>
        <h1>NUBE MINING</h1>
        <p style="color: #888;">Verifica tu World ID para minar</p>
        <button class="btn-gold" onclick="verificar()">CONECTAR WORLD ID</button>
        <div id="status">Iniciando...</div>
    </div>

    <div id="main-app">
        <div style="font-size: 50px;">⛏️</div>
        <h1 style="color: #4ade80;">MINERÍA ACTIVA</h1>
        <p>Procesando bloques...</p>
    </div>

    <script>
        const APP_ID = "app_d77095720a626cfb6315c02b5b5f2473";
        const ACTION = "acceso-nube"; // Coincide con tu Identifier del portal

        async function init() {
            try {
                await window.MiniKit.install(APP_ID);
                if (window.MiniKit.isInstalled()) {
                    document.getElementById('status').innerText = "CONECTADO A WORLD APP ✅";
                }
            } catch (e) {
                document.getElementById('status').innerText = "⚠️ ABRE DESDE WORLD APP";
            }
        }

        async function verificar() {
            try {
                const res = await window.MiniKit.commands.verify({
                    action: ACTION,
                    signal: "user_" + Math.random().toString(36).substring(7),
                });

                if (res.finalPayload) {
                    document.getElementById('verify-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                }
            } catch (err) {
                // Si el portal sigue dando error, mostramos el detalle técnico
                console.error(err);
                alert("Error de comunicación con el Portal. Revisa que la Acción esté en modo Staging.");
            }
        }

        init();
    </script>
</body>
</html>
