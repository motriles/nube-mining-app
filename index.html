<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nube Mining - Worldcore</title>
    
    <!-- Librería MiniKit para World App -->
    <script type="module">
      import { MiniKit } from "https://cdn.jsdelivr.net";
      window.MiniKit = MiniKit;
      // Importante: Inicializa la conexión
      MiniKit.install();
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">

    <h1>Nube Mining ☁️</h1>
    <p>Verifica tu humanidad para empezar a minar.</p>

    <!-- Botón de verificación -->
    <button onclick="verificarYMinar()" style="padding: 20px; font-size: 18px; background: black; color: white; border-radius: 10px; border: none; cursor: pointer;">
        Verificar con World ID
    </button>

    <script>
      async function verificarYMinar() {
        

        try {
          // Usamos el ID de acción que creaste: iniciar-mineria
          const { finalPayload } = await window.MiniKit.commandsAsync.verify({
            action: "claim-daily-mining", 
            verification_level: "orb" 
          });

          if (finalPayload.status === "success") {
            alert("¡Verificación exitosa! Bienvenido a la línea Worldcore.");
            // Aquí puedes añadir la lógica de inicio de minería
          }
        } catch (error) {
          console.error("Error:", error);
          alert("Hubo un problema con la verificación.");
        }
      }
    </script>

</body>
</html>
