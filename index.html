<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module">
      import { MiniKit } from "https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@latest";
      window.MiniKit = MiniKit;
      MiniKit.install();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUBE MINING v7.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #05070a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding-top: 35px; overflow: hidden; }
        .font-crypto { font-family: 'Orbitron', sans-serif; }
        
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 32px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #1a1a1a; z-index: 4000; font-family: 'Orbitron', sans-serif; }
        .compra-tag { color: #4ade80; font-weight: bold; font-size: 8px; }
        .compra-monto { color: #f6e05e; font-weight: 800; font-size: 9px; margin-left: 5px; }

        .glass-card { background: #0d1117; border: 1px solid #21262d; border-radius: 35px; padding: 1.8rem; width: 92%; max-width: 380px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.9); position: relative; }
        
        /* LOGO SOLICITADO */
        .logo-mini { width: 60px; height: 60px; margin: 0 auto 10px; opacity: 1; object-fit: contain; }

        /* SALDO NÍTIDO */
        #saldo { font-size: 4rem; font-weight: 700; color: #ffffff; line-height: 1; margin-bottom: 5px; }

        /* BARRA 0 A 500 */
        .progress-wrapper { margin: 20px 0; }
        .progress-labels { display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 10px; color: #4b5563; margin-bottom: 5px; font-weight: bold; }
        .progress-container { width: 100%; height: 8px; background: #161b22; border-radius: 10px; border: 1px solid #30363d; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #f6e05e, #4ade80); width: 0%; transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* PASOS: MÁXIMA LECTURA */
        .steps-grid { display: grid; grid-template-cols: repeat(3, 1fr); gap: 2px; margin-top: 15px; padding: 15px 0; border-top: 1px solid #21262d; border-bottom: 1px solid #21262d; }
        .step-box p:first-child { color: #ffffff; font-weight: 700; font-size: 9px; font-family: 'Orbitron', sans-serif; min-height: 30px; display: flex; align-items: center; justify-content: center; line-height: 1.2; text-transform: uppercase; }
        .step-box p:last-child { color: #f6e05e; font-size: 7px; font-weight: 800; margin-top: 4px; letter-spacing: 1px; }

        .gold-btn { background: linear-gradient(135deg, #f6e05e, #d69e2e); color: #000; font-weight: 900; border-radius: 15px; padding: 16px; width: 100%; cursor: pointer; border: none; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; transition: 0.2s; }
        
        /* BOTÓN WORLD ID SIMULADO */
        .world-btn { background: #ffffff; color: #000; font-weight: 800; border-radius: 15px; padding: 14px; width: 100%; cursor: pointer; border: none; text-transform: uppercase; font-size: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .world-btn:active { transform: scale(0.98); }
        
        .btn-disabled { background: #161b22 !important; color: #30363d !important; cursor: not-allowed; border: 1px solid #21262d; }
        
        input { width: 100%; padding: 14px; background: #000; border: 1px solid #30363d; border-radius: 12px; color: #fff; margin-bottom: 12px; text-align: center; outline: none; font-size: 13px; }
        #live-notif { font-size: 8px; color: #4ade80; text-transform: uppercase; margin-top: 15px; font-family: 'Orbitron'; letter-spacing: 1.5px; font-weight: 600; }
        
        #capa-ad { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; }
        .btn-cerrar { position: absolute; top: 25px; right: 20px; z-index: 6000; background: #f6e05e; color: black; padding: 10px 18px; border-radius: 12px; font-weight: 900; border: 2px solid black; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div><span class="compra-tag">RED:</span><span id="monto-real" class="compra-monto">SINCRONIZANDO...</span></div>
        <span style="color:#4b5563; font-size:7px; font-family: 'Orbitron';">WORLD CHAIN ACTIVE</span>
    </div>

    <div id="capa-ad">
        <button class="btn-cerrar" onclick="cerrarAd()">X CERRAR</button>
        <iframe id="frame-ad" src="" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div class="glass-card">
        <div id="user-id" class="text-[10px] text-yellow-500/90 mb-4 font-mono font-bold tracking-[0.2em]">IDENTIFICANDO...</div>
        
        <img src="logo.png" class="logo-mini">
        
        <div id="saldo" class="font-crypto">0</div>
        <div class="text-white/40 text-[9px] mb-4 uppercase font-bold tracking-widest">Nubes Acumuladas</div>
        
        <div class="progress-wrapper">
            <div class="progress-labels">
                <span>0</span>
                <span>OBJETIVO: 500</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>

        <div class="steps-grid mb-6">
            <div class="step-box">
                <p>ACUMULA HASTA 500</p>
                <p>Paso 1</p>
            </div>
            <div class="step-box" style="border-left: 1px solid #21262d; border-right: 1px solid #21262d;">
                <p>SOLICITA EL COBRO</p>
                <p>Paso 2</p>
            </div>
            <div class="step-box">
                <p>RECÍBELO Y VENDE 💰</p>
                <p>Paso 3</p>
            </div>
        </div>

        <div id="section-mining">
            <button id="btn-verify" onclick="verificarUsuario()" class="world-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20ZM11 15.17L7.83 12L6.41 13.41L11 18L18 11L16.59 9.59L11 15.17Z" fill="black"/></svg>
                Verificar Humano
            </button>
            <button id="btn-main" onclick="minarAhora()" class="gold-btn">INICIAR MINERÍA</button>
        </div>

        <div id="section-withdraw" class="hidden">
            <input type="text" id="wallet-wc" placeholder="Billetera World Chain">
            <button onclick="enviarSolicitud()" class="gold-btn" style="background: linear-gradient(135deg, #4ade80, #22c55e);">RECLAMAR PAGOS</button>
        </div>
        
        <div id="container-timer" class="mt-4 hidden">
            <p id="timer" class="text-[11px] text-yellow-500 font-mono font-bold tracking-tighter"></p>
        </div>

        <p id="live-notif">SISTEMA EN LINEA</p>
    </div>

    <script>
        // Lógica de Verificación World ID
        async function verificarUsuario() {
          if (!window.MiniKit || !window.MiniKit.isInstalled()) {
            alert("Por favor, abre la app desde World App");
            return;
          }

          try {
            const result = await window.MiniKit.commandsAsync.verify({
              action: "confirm-human", // Asegúrate que este ID coincida con tu portal
              verification_level: "Orb" 
            });

            if (result.finalPayload.status === "success") {
              alert("¡Verificación exitosa! Ahora puedes minar.");
              document.getElementById('btn-verify').style.display = 'none';
            }
          } catch (error) {
            console.error(error);
          }
        }

        const params = new URLSearchParams(window.location.search);
        let wallet = params.get('i');

        function init() {
            const userDisplay = document.getElementById('user-id');
            if (!wallet) {
                wallet = localStorage.getItem('minero_id');
                if (!wallet) {
                    wallet = "ID_" + Math.floor(Math.random() * (999999 - 100000) + 100000);
                    localStorage.setItem('minero_id', wallet);
                }
            }
            if (wallet.startsWith('0x')) {
                const short = wallet.substring(0, 6) + "..." + wallet.substring(wallet.length - 4);
                userDisplay.innerHTML = `<span style="color: #4ade80;">●</span> VERIFIED: <span style="color: #4ade80;">${short}</span>`;
                document.getElementById('btn-verify').style.display = 'none';
            } else {
                userDisplay.innerText = "OPERADOR GLOBAL: #" + wallet.replace("ID_", "");
            }
            actualizarEstado();
            
            setInterval(() => {
                const status = ["SISTEMA LISTO", "BLOQUE VERIFICADO", "RED ESTABLE", "BUSCANDO NUBES"];
                document.getElementById('live-notif').innerText = status[Math.floor(Math.random()*status.length)];
            }, 5000);
        }
