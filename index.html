<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nube Mining - Worldcore</title>
    
    <!-- SDK Oficial de MiniKit corregido -->
    <script src="https://cdn.jsdelivr.net"></script>

    <style>
        :root {
            --primary: #000000;
            --accent: #00c3ff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%);
            color: var(--primary);
        }

        /* Animación de Nubes Worldcore */
        .clouds {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
            background: url('https://www.transparenttextures.com');
            animation: moveClouds 60s linear infinite;
        }

        @keyframes moveClouds {
            from { background-position: 0 0; }
            to { background-position: 1000px 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 80%;
            text-align: center;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 30px; }

        .btn-verify {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            background: var(--primary);
            color: white;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-verify:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="clouds"></div>

    <div class="container">
        <h1>Nube Mining ☁️</h1>
        <p>Verifica tu humanidad para entrar en la línea Worldcore.</p>

        <button class="btn-verify" onclick="verificarYMinar()">
            Verificar con World ID
        </button>
    </div>

    <script>
        // Inicializar MiniKit nada más cargar
        window.addEventListener('load', () => {
            if (window.MiniKit) {
                window.MiniKit.install();
                console.log("MiniKit instalado con éxito");
            }
        });

        async function verificarYMinar() {
            // Solo intentamos la verificación si MiniKit está presente
            if (!window.MiniKit) {
                alert("Cargando sistema... espera 2 segundos.");
                return;
            }

            try {
                const { finalPayload } = await window.MiniKit.commandsAsync.verify({
                    action: "claim-daily-mining", 
                    verification_level: "orb" 
                });

                if (finalPayload.status === "success") {
                    alert("¡HUMANO DETECTADO! Bienvenido a la red.");
                }
            } catch (error) {
                console.error("Error de WorldKit:", error);
                // No mostramos alert aquí para evitar el mensaje molesto al abrir
            }
        }
    </script>

</body>
</html>
